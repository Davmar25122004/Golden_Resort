spring.application.name=tfg

# Supabase Auth (email verification)
supabase.url=https://udojqeioeixaxbsxwpfe.supabase.co
# Obtén la anon key en: Supabase Dashboard > Project Settings > API > Project API Keys > anon public
supabase.anon-key=${SUPABASE_ANON_KEY}
# URL a la que Supabase redirige tras verificar el email. En producción, cámbiala a tu dominio real.
supabase.redirect-url=${APP_PUBLIC_URL:http://localhost:8080}/verificar-email
spring.profiles.active=prod

spring.config.activate.on-profile=prod

spring.datasource.url=jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:5432/postgres?prepareThreshold=0
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

spring.security.oauth2.client.registration.google.client-id=1075712410495-8m4l6e0f3dupiv4i957hlodvse19cdi9.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

spring.output.ansi.enabled=ALWAYS

# Configuración de subida de archivos (imágenes pesadas)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# SMTP para envío de facturas (configura SMTP_USER y SMTP_PASS como variables de entorno)
# Gmail: activa "Acceso de aplicaciones menos seguras" o usa una contraseña de aplicación
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=hgoldenresort@gmail.com
spring.mail.password=${GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=hgoldenresort@gmail.com
app.mail.from-name=Golden Resort
# URL pública del servidor — usada para enlazar imágenes en los correos.
# Si el correo se abre fuera de tu red local, esta URL debe ser accesible desde Internet
# (cámbiala por el dominio público / túnel ngrok / etc.).
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}

# ── Horario fijo de check-in / check-out del hotel ───────────────────────────
hotel.checkin-time=15:00
hotel.checkout-time=11:00