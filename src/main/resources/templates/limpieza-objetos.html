<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Resort | Objetos perdidos</title>

    <link rel="stylesheet" th:href="@{/lib/bootstrap-5.3.8-dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/accessibility.css}">
    <link rel="stylesheet" th:href="@{/css/limpieza.css}">
</head>
<body>

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div id="main-content" style="display:block;">
        <div class="container">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mt-4 mb-3 gap-2">
                <div>
                    <h2 class="serif text-gold mb-1">Objetos perdidos</h2>
                    <p class="text-muted mb-0" style="font-size:0.85rem; letter-spacing:1px;">Registro de objetos encontrados</p>
                </div>
                <div class="d-flex gap-2 align-items-center flex-wrap">
                    <div class="form-check form-switch text-light">
                        <input class="form-check-input" type="checkbox" id="obj-solo-disponibles" checked onchange="objRecargar()">
                        <label class="form-check-label" for="obj-solo-disponibles" style="font-size:0.8rem;">Solo disponibles</label>
                    </div>
                    <button class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#newObjModal">+ Reportar objeto</button>
                </div>
            </div>

            <div id="obj-root" class="row g-3 mt-2">
                <div class="col-12 text-center text-muted py-5">Cargando…</div>
            </div>
        </div>
    </div>

    <!-- MODAL nuevo objeto perdido -->
    <div class="modal fade modal-dark" id="newObjModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body">
                    <h3 class="serif text-gold mb-3" style="font-size:1.4rem;">Reportar objeto perdido</h3>
                    <div id="no-error"   class="alert alert-danger d-none py-2" style="font-size:0.8rem;"></div>
                    <div id="no-success" class="alert alert-success d-none py-2" style="font-size:0.85rem;"></div>
                    <form onsubmit="objCrear(event)">
                        <label class="form-label small text-muted">Foto del objeto</label>
                        <input type="file" class="form-control mb-2" id="no-file" accept="image/jpeg,image/png">

                        <label class="form-label small text-muted">Habitación donde se encontró</label>
                        <select class="form-select mb-2" id="no-habitacion">
                            <option value="">— Sin habitación / zona común —</option>
                        </select>

                        <div class="row g-2">
                            <div class="col-12">
                                <label class="form-label small text-muted">Fecha y hora encontrado</label>
                                <input type="datetime-local" class="form-control" id="no-fecha" required>
                            </div>
                        </div>

                        <label class="form-label small text-muted mt-2">Descripción</label>
                        <textarea class="form-control" id="no-descripcion" rows="3" required placeholder="Ej: Cargador de móvil iPhone, en cajón mesilla..."></textarea>

                        <button type="submit" class="btn-gold mt-3 w-100">Registrar objeto</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: marcar como entregado -->
    <div class="modal fade modal-dark" id="entregarModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body">
                    <h3 class="serif text-gold mb-3" style="font-size:1.4rem;">Marcar como entregado</h3>
                    <input type="hidden" id="ent-id">
                    <label class="form-label small text-muted">Detalle de la entrega (opcional)</label>
                    <textarea class="form-control" id="ent-notas" rows="3" placeholder="Ej: Entregado al cliente David Pérez..."></textarea>
                    <button class="btn-gold mt-3 w-100" onclick="objEntregar()">Confirmar entrega</button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/lib/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/14-i18n.js}"></script>
    <script th:src="@{/js/15-accessibility.js}"></script>
    <script th:src="@{/js/01-globals.js}"></script>
    <script th:src="@{/js/04-ui-core.js}"></script>
    <script th:src="@{/js/03-navegacion.js}"></script>
    <script th:src="@{/js/10-auth.js}"></script>
    <script th:src="@{/js/13-init.js}"></script>
    <script th:src="@{/js/24-limpieza-objetos.js}"></script>

</body>
</html>
