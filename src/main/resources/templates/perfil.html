<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Resort | Mi Perfil</title>

    <link rel="stylesheet" th:href="@{/lib/bootstrap-5.3.8-dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/lib/swiper-12.1.3/package/swiper-bundle.min.css}">
    <link rel="stylesheet" th:href="@{/lib/aos-master/dist/aos.css}">
    <link rel="stylesheet" th:href="@{/lib/flatpickr/flatpickr.min.css}">

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/hero.css}">
    <link rel="stylesheet" th:href="@{/css/flatpickr.css}">
    <link rel="stylesheet" th:href="@{/css/habitaciones.css}">
    <link rel="stylesheet" th:href="@{/css/servicios.css}">
    <link rel="stylesheet" th:href="@{/css/contacto.css}">
    <link rel="stylesheet" th:href="@{/css/admin-panel.css}">
    <link rel="stylesheet" th:href="@{/css/reserva-form.css}">
    <link rel="stylesheet" th:href="@{/css/habitacion-detail.css}">
    <link rel="stylesheet" th:href="@{/css/mis-reservas.css}">
    <link rel="stylesheet" th:href="@{/css/servicio-detail.css}">
    <link rel="stylesheet" th:href="@{/css/accessibility.css}">
    <link rel="stylesheet" th:href="@{/css/pago.css}">
    <link rel="stylesheet" th:href="@{/css/perfil.css}">
</head>
<body>

    <!-- NAVBAR -->
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <!-- Contenido dinámico -->
    <div id="main-content">
        <div id="dynamic-view">
            <div class="container">
                <div class="perfil-loading" id="perfil-initial-loader">
                    <div class="perfil-spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL AUTH -->
    <div class="modal fade modal-dark" id="authModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body">
                    <ul class="nav nav-pills mb-4 justify-content-center border-bottom border-secondary pb-3">
                        <li class="nav-item">
                            <button class="nav-link active" id="tab-login" onclick="showAuthTab('login')" data-i18n="auth_signin_tab">Iniciar Sesión</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" id="tab-register" onclick="showAuthTab('register')" data-i18n="auth_register_tab">Registrarse</button>
                        </li>
                    </ul>
                    <div id="auth-error" class="alert alert-danger d-none py-2" style="font-size:0.8rem;"></div>
                    <form id="form-login" onsubmit="handleLogin(event)">
                        <div class="mb-3">
                            <label class="form-label" data-i18n="auth_email">Email</label>
                            <input type="email" class="form-control" id="login-email" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" data-i18n="auth_password">Contraseña</label>
                            <input type="password" class="form-control" id="login-password" required>
                        </div>
                        <button type="submit" class="btn-gold" data-i18n="auth_enter">Entrar</button>
                        <div class="auth-divider"><span data-i18n="auth_or">o</span></div>
                        <a href="/oauth2/authorization/google" class="btn-google">
                            <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg" alt="Google">
                            <span data-i18n="auth_google">Continuar con Google</span>
                        </a>
                    </form>
                    <form id="form-register" class="d-none" onsubmit="handleRegister(event)">
                        <div class="mb-3">
                            <label class="form-label" data-i18n="auth_name">Nombre</label>
                            <input type="text" class="form-control" id="reg-nombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="auth_email">Email</label>
                            <input type="email" class="form-control" id="reg-email" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" data-i18n="auth_password">Contraseña</label>
                            <input type="password" class="form-control" id="reg-password" required minlength="6">
                        </div>
                        <button type="submit" class="btn-gold" data-i18n="auth_create">Crear Cuenta</button>
                        <div class="auth-divider"><span data-i18n="auth_or">o</span></div>
                        <a href="/oauth2/authorization/google" class="btn-google">
                            <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg" alt="Google">
                            <span data-i18n="auth_google">Continuar con Google</span>
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- COOKIE BANNER -->
    <div id="cookie-banner" class="cookie-banner" style="display:none;">
        <div class="cookie-banner-content">
            <h4 class="serif mb-2" style="color:var(--gold); font-size:1.4rem;">Tu Privacidad</h4>
            <p style="font-size:0.85rem; color:var(--text-muted-custom); margin-bottom:18px; line-height:1.5;">
                Utilizamos cookies propias y de terceros para mejorar tu experiencia, analizar la navegación y mostrarte contenidos personalizados acordes a tus preferencias. Puedes aceptarlas todas o continuar solo con las esenciales.
            </p>
            <div class="cookie-banner-actions">
                <button class="btn-reservar" style="padding:10px 24px; font-size:0.85rem; border-radius:6px;" onclick="acceptCookies(true)">Aceptar todas</button>
                <button class="btn-reservar" style="padding:10px 24px; font-size:0.85rem; border-radius:6px;" onclick="acceptCookies(false)">Solo esenciales</button>
            </div>
        </div>
    </div>
    <style>
        .cookie-banner { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); width:90%; max-width:500px; background:#111; border:1px solid rgba(185,149,77,0.4); border-radius:12px; z-index:99999; box-shadow:0 10px 40px rgba(0,0,0,0.8); padding:24px; animation:slideUpCookie 0.5s ease-out forwards; }
        .cookie-banner-actions { display:flex; gap:12px; justify-content:flex-end; }
        @keyframes slideUpCookie { from { transform:translate(-50%,100%); opacity:0; } to { transform:translate(-50%,0); opacity:1; } }
        @media (max-width:576px) { .cookie-banner { bottom:12px; width:95%; padding:20px; } .cookie-banner-actions { flex-direction:column; } .cookie-banner-actions button { width:100%; } }
    </style>

    <!-- JS Libraries -->
    <script th:src="@{/lib/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/lib/swiper-12.1.3/package/swiper-bundle.min.js}"></script>
    <script th:src="@{/lib/aos-master/dist/aos.js}"></script>
    <script th:src="@{/lib/flatpickr/flatpickr.min.js}"></script>
    <script th:src="@{/lib/flatpickr/l10n/es.js}"></script>

    <!-- JS -->
    <script th:src="@{/js/14-i18n.js}"></script>
    <script th:src="@{/js/15-accessibility.js}"></script>
    <script th:src="@{/js/01-globals.js}"></script>
    <script th:src="@{/js/02-flatpickr-config.js}"></script>
    <script th:src="@{/js/04-ui-core.js}"></script>
    <script th:src="@{/js/03-navegacion.js}"></script>
    <script th:src="@{/js/10-auth.js}"></script>
    <script th:src="@{/js/17-pago.js}"></script>
    <script th:src="@{/js/16-perfil.js}"></script>
    <script th:src="@{/js/13-init.js}"></script>

</body>
</html>
