<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Fragmento navbar reutilizable. Renderizado server-side para evitar el flash
  inicial mientras el JS verifica la sesión.

  Variables esperadas (inyectadas por NavbarAdvice):
    navAutenticado, navUsuario, navEmail, navRoles,
    navEsAdmin, navEsRecepcion, navEsStaff, navEsCliente
-->
<nav id="navbar" class="navbar navbar-expand-md navbar-dark" th:fragment="navbar"
     th:with="navAutenticado=${navAutenticado ?: false},
              navEsAdmin=${navEsAdmin ?: false},
              navEsRecepcion=${navEsRecepcion ?: false},
              navEsLimpieza=${navEsLimpieza ?: false},
              navEsStaff=${navEsStaff ?: false},
              navEsCliente=${navEsCliente ?: false},
              navRoles=${navRoles ?: {}}"
     th:attr="data-auth=${navAutenticado},
              data-user=${navUsuario},
              data-roles=${#strings.arrayJoin(navRoles.toArray(),',')},
              data-staff=${navEsStaff},
              data-admin=${navEsAdmin},
              data-recepcion=${navEsRecepcion},
              data-cliente=${navEsCliente}">
    <div class="container">
        <a href="/" class="navbar-brand-custom" onclick="event.preventDefault(); goHome()">GOLDEN RESORT</a>

        <button class="navbar-toggler shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navCollapse"
                style="border-color: rgba(201,168,76,0.6); padding: 4px 8px;">
            <span class="navbar-toggler-icon" style="filter: brightness(0) saturate(100%) invert(77%) sepia(21%) saturate(1450%) hue-rotate(6deg) brightness(88%) contrast(85%); width: 1.2em; height: 1.2em;"></span>
        </button>

        <div class="collapse navbar-collapse p-3 p-md-0 mt-2 mt-md-0" id="navCollapse">
            <div class="d-flex flex-column flex-md-row align-items-center gap-2 gap-md-1 my-3 my-md-0 mx-md-auto" id="nav-links">

                <!-- Enlaces públicos: visibles para invitado, cliente y admin. Se ocultan a recepción pura. -->
                <a th:if="${(!navEsRecepcion and !navEsLimpieza) and !navEsAdmin}" href="/" class="nav-link-custom"
                   onclick="event.preventDefault(); scrollToSection('habitaciones')"
                   data-bs-toggle="collapse" data-bs-target=".navbar-collapse.show">
                    <span data-i18n="nav_rooms">Habitaciones</span>
                </a>
                <a th:if="${(!navEsRecepcion and !navEsLimpieza) and !navEsAdmin}" href="/" class="nav-link-custom"
                   onclick="event.preventDefault(); scrollToSection('servicios')"
                   data-bs-toggle="collapse" data-bs-target=".navbar-collapse.show">
                    <span data-i18n="nav_services">Servicios</span>
                </a>
                <a th:if="${(!navEsRecepcion and !navEsLimpieza) and !navEsAdmin}" href="/" class="nav-link-custom"
                   onclick="event.preventDefault(); scrollToSection('contacto')"
                   data-bs-toggle="collapse" data-bs-target=".navbar-collapse.show">
                    <span data-i18n="nav_contact">Contacto</span>
                </a>

                <span id="nav-mis-reservas" th:if="${navEsCliente}">
                    <a href="/mis-reservas" class="nav-link-custom"><span data-i18n="nav_my_bookings">Mis Reservas</span></a>
                </span>

                <span id="nav-recepcion" th:if="${navEsRecepcion}">
                    <a href="/recepcion" class="nav-link-custom">Recepción</a>
                </span>

                <span id="nav-limpieza" th:if="${navEsLimpieza and !navEsAdmin}">
                    <a href="/limpieza" class="nav-link-custom">Limpieza</a>
                </span>
                <span id="nav-limpieza-cal" th:if="${navEsLimpieza and !navEsAdmin}">
                    <a href="/limpieza/calendario" class="nav-link-custom">Calendario</a>
                </span>
                <span id="nav-limpieza-inc" th:if="${navEsLimpieza and !navEsAdmin}">
                    <a href="/limpieza/incidencias" class="nav-link-custom">Incidencias</a>
                </span>
                <span id="nav-limpieza-obj" th:if="${navEsLimpieza and !navEsAdmin}">
                    <a href="/limpieza/objetos-perdidos" class="nav-link-custom">Objetos perdidos</a>
                </span>

                <span id="nav-mensajeria" th:if="${navEsRecepcion and !navEsAdmin}">
                    <a href="/mensajeria" class="nav-link-custom">Mensajería</a>
                </span>

                <span id="nav-peticiones" th:if="${navEsRecepcion and !navEsAdmin}">
                    <a href="/peticiones" class="nav-link-custom">Peticiones</a>
                </span>

                <span id="nav-calendario" th:if="${navEsRecepcion and !navEsAdmin}">
                    <a href="/recepcion/calendario" class="nav-link-custom">Calendario</a>
                </span>

                <!-- El link Admin se elimina: el sidebar provee acceso al panel -->
                <span id="nav-admin" th:if="false"></span>
            </div>

            <div class="d-flex flex-column flex-md-row align-items-center gap-3">

                <span id="nav-bell" class="nav-bell" th:if="${navEsRecepcion and !navEsAdmin}"
                      style="display:inline-flex;" onclick="location.href='/mensajeria'">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    <span id="nav-bell-badge" class="nav-bell-badge" style="display:none;">0</span>
                </span>

                <span id="nav-user" th:if="${navAutenticado}" th:text="${navUsuario}" style="display:inline;"></span>

                <a id="btn-perfil" href="/perfil" class="btn-perfil-nav" th:if="${navAutenticado}"
                   style="display:flex;" title="Mi Perfil">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                    </svg>
                </a>

                <!-- Botón Reservar: invitado hace scroll en home; autenticado-cliente vuelve a home -->
                <button id="btn-reservar-nav" class="btn-reservar"
                        th:if="${!navEsStaff and !navAutenticado}"
                        onclick="scrollToSection('habitaciones')"
                        data-bs-toggle="collapse" data-bs-target=".navbar-collapse.show"
                        data-i18n="nav_book">Reservar</button>
                <button id="btn-reservar-nav" class="btn-reservar"
                        th:if="${navEsCliente}"
                        onclick="goHome()"
                        data-bs-toggle="collapse" data-bs-target=".navbar-collapse.show"
                        data-i18n="nav_book">Reservar</button>

                <!-- Botón Auth: distinto según haya sesión -->
                <button id="btn-auth" class="btn-reservar"
                        th:if="${!navAutenticado}"
                        onclick="openAuthModal()"
                        data-bs-toggle="collapse" data-bs-target=".navbar-collapse.show"
                        data-i18n="nav_signin">Iniciar Sesión</button>
                <button id="btn-auth" class="btn-reservar"
                        th:if="${navAutenticado}"
                        onclick="logout()"
                        data-bs-toggle="collapse" data-bs-target=".navbar-collapse.show"
                        data-i18n="nav_signout">Cerrar Sesión</button>

                <div class="lang-switcher">
                    <button class="lang-btn lang-btn--active" data-lang="es" onclick="setLang('es')">ES</button>
                    <span class="lang-sep">|</span>
                    <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
                </div>

            </div>
        </div>
    </div>
</nav>

</body>
</html>
