<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%230D0D0D'/><text x='50' y='72' font-size='68' text-anchor='middle' font-family='Georgia,serif' fill='%23C9A84C'>G</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Resort | Calendario de Limpieza</title>

    <link rel="stylesheet" th:href="@{/lib/bootstrap-5.3.8-dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/accessibility.css}">
    <link rel="stylesheet" th:href="@{/css/recepcion-calendario.css}">
    <link rel="stylesheet" th:href="@{/css/limpieza.css}">
</head>
<body>

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div id="cal-page" style="display:block;">
        <div class="cal-container">
            <header class="cal-header">
                <h1 class="cal-title">PLAN DE LIMPIEZA</h1>
                <div class="cal-view-tabs" role="tablist">
                    <button type="button" class="cal-tab cal-tab--active" data-view="anual">CALENDARIO</button>
                    <button type="button" class="cal-tab" data-view="mensual">MENSUAL</button>
                </div>
                <div class="cal-context-selector">
                    <button type="button" class="cal-nav-btn" id="cal-prev" aria-label="Anterior">‹</button>
                    <span id="cal-context-label">2026</span>
                    <button type="button" class="cal-nav-btn" id="cal-next" aria-label="Siguiente">›</button>
                </div>
            </header>
            <main id="cal-content" class="cal-content">
                <div class="cal-loading">Cargando…</div>
            </main>
        </div>

        <!-- Modal del día (mismo estilo que recepción) -->
        <div class="modal fade cal-modal" id="calDiaModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="calDiaTitulo">Checkouts</h5>
                        <button type="button" class="btn-volver-cal" data-bs-dismiss="modal">← Volver al calendario</button>
                    </div>
                    <div class="modal-body" id="calDiaBody">
                        <div class="text-center py-4 text-muted">Cargando…</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/lib/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/14-i18n.js}"></script>
    <script th:src="@{/js/15-accessibility.js}"></script>
    <script th:src="@{/js/01-globals.js}"></script>
    <script th:src="@{/js/00-api-urls.js}"></script>
    <script th:src="@{/js/00-enums.js}"></script>
    <script th:src="@{/js/04-ui-core.js}"></script>
    <script th:src="@{/js/03-navegacion.js}"></script>
    <script th:src="@{/js/10-auth.js}"></script>
    <script th:src="@{/js/13-init.js}"></script>
    <script th:src="@{/js/22-limpieza-calendario.js}"></script>

</body>
</html>
