<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Resort | Incidencias</title>

    <link rel="stylesheet" th:href="@{/lib/bootstrap-5.3.8-dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/accessibility.css}">
    <link rel="stylesheet" th:href="@{/css/limpieza.css}">
</head>
<body>

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div id="main-content" style="display:block;">
        <div class="container">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mt-4 mb-3 gap-2">
                <div>
                    <h2 class="serif text-gold mb-1">Incidencias</h2>
                    <p class="text-muted mb-0" style="font-size:0.85rem; letter-spacing:1px;">Mantenimiento e inventario reportados</p>
                </div>
                <div class="d-flex gap-2 align-items-center flex-wrap">
                    <div class="form-check form-switch text-light">
                        <input class="form-check-input" type="checkbox" id="inc-solo-abiertas" checked onchange="incRecargar()">
                        <label class="form-check-label" for="inc-solo-abiertas" style="font-size:0.8rem;">Solo abiertas</label>
                    </div>
                    <button class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#newIncModal">+ Nueva</button>
                </div>
            </div>

            <div id="inc-root" class="mt-3">
                <div class="text-center text-muted py-5">Cargando…</div>
            </div>
        </div>
    </div>

    <!-- MODAL nueva incidencia -->
    <div class="modal fade modal-dark" id="newIncModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body">
                    <h3 class="serif text-gold mb-3" style="font-size:1.4rem;">Nueva incidencia</h3>
                    <div id="ni-error" class="alert alert-danger d-none py-2" style="font-size:0.8rem;"></div>
                    <form onsubmit="incCrear(event)">
                        <label class="form-label small text-muted">Habitación (opcional)</label>
                        <select class="form-select mb-2" id="ni-habitacion">
                            <option value="">— Sin habitación —</option>
                        </select>
                        <div class="row g-2">
                            <div class="col-6">
                                <label class="form-label small text-muted">Tipo</label>
                                <select class="form-select" id="ni-tipo">
                                    <option value="MANTENIMIENTO">Mantenimiento</option>
                                    <option value="INVENTARIO">Inventario</option>
                                    <option value="OTRO">Otro</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label small text-muted">Prioridad</label>
                                <select class="form-select" id="ni-prioridad">
                                    <option value="BAJA">Baja</option>
                                    <option value="NORMAL" selected>Normal</option>
                                    <option value="ALTA">Alta</option>
                                    <option value="URGENTE">Urgente</option>
                                </select>
                            </div>
                        </div>
                        <label class="form-label small text-muted mt-2">Descripción</label>
                        <textarea class="form-control" id="ni-descripcion" rows="3" required></textarea>
                        <button type="submit" class="btn-gold mt-3 w-100">Reportar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL resolver -->
    <div class="modal fade modal-dark" id="resolverModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body">
                    <h3 class="serif text-gold mb-3" style="font-size:1.4rem;">Resolver incidencia</h3>
                    <input type="hidden" id="res-id">
                    <label class="form-label small text-muted">Comentario de resolución</label>
                    <textarea class="form-control" id="res-comentario" rows="3"></textarea>
                    <button class="btn-gold mt-3 w-100" onclick="incResolver()">Marcar como resuelta</button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/lib/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/14-i18n.js}"></script>
    <script th:src="@{/js/15-accessibility.js}"></script>
    <script th:src="@{/js/01-globals.js}"></script>
    <script th:src="@{/js/00-api-urls.js}"></script>
    <script th:src="@{/js/00-enums.js}"></script>
    <script th:src="@{/js/04-ui-core.js}"></script>
    <script th:src="@{/js/03-navegacion.js}"></script>
    <script th:src="@{/js/10-auth.js}"></script>
    <script th:src="@{/js/13-init.js}"></script>
    <script th:src="@{/js/23-limpieza-incidencias.js}"></script>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
