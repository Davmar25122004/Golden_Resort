<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña · Golden Resort</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%230D0D0D'/><text x='50' y='72' font-size='68' text-anchor='middle' font-family='Georgia,serif' fill='%23C9A84C'>G</text></svg>">
    <link rel="stylesheet" th:href="@{/lib/bootstrap-5.3.8-dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <style>
        body { background: #0D0D0D; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .reset-card {
            background: #1A1A1A;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
        }
        .reset-logo { height: 60px; width: auto; display: block; margin: 0 auto 12px; }
        .reset-brand { font-family: Georgia, serif; font-size: 22px; letter-spacing: 5px; color: #C9A84C; text-align: center; margin-bottom: 4px; }
        .reset-tagline { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #9A9A9A; text-align: center; margin-bottom: 32px; }
        .reset-title { font-family: Georgia, serif; font-size: 18px; color: #F5F0E8; margin-bottom: 8px; }
        .reset-sub { font-size: 13px; color: #9A9A9A; margin-bottom: 28px; line-height: 1.6; }
        .form-label { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: #9A9A9A; }
        .form-control { background: #111; border: 1px solid #333; color: #F5F0E8; }
        .form-control:focus { background: #111; border-color: #C9A84C; color: #F5F0E8; box-shadow: none; }
        .btn-gold { width: 100%; background: #C9A84C; color: #0D0D0D; border: none; padding: 12px; font-family: Georgia, serif; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; border-radius: 4px; margin-top: 8px; cursor: pointer; }
        .btn-gold:hover { background: #e0bf6a; }
        .btn-gold:disabled { opacity: 0.6; cursor: not-allowed; }
        .reset-alert { font-size: 13px; padding: 10px 14px; border-radius: 4px; margin-top: 16px; display: none; }
        .reset-alert.ok { background: rgba(40,167,69,0.15); border: 1px solid rgba(40,167,69,0.3); color: #6fcf97; }
        .reset-alert.err { background: rgba(220,53,69,0.15); border: 1px solid rgba(220,53,69,0.3); color: #eb5757; }
        .back-link { display: block; text-align: center; margin-top: 20px; font-size: 12px; color: #9A9A9A; text-decoration: none; letter-spacing: 1px; }
        .back-link:hover { color: #C9A84C; }
    </style>
</head>
<body>

<div class="reset-card">
    <img th:src="@{/images/logo.png}" alt="Golden Resort" class="reset-logo">
    <div class="reset-brand">GOLDEN RESORT</div>
    <div class="reset-tagline">Lujo · Distinción · Confort</div>

    <!-- Token inválido/expirado -->
    <div th:if="${error}" class="reset-alert err" style="display:block;" th:text="${error}"></div>

    <!-- Formulario nueva contraseña -->
    <div th:if="${token}">
        <div class="reset-title">Nueva contraseña</div>
        <div class="reset-sub">Introduce tu nueva contraseña. Debe tener al menos 6 caracteres.</div>

        <form id="form-reset" onsubmit="submitReset(event)">
            <input type="hidden" id="reset-token" th:value="${token}">
            <div class="mb-3">
                <label class="form-label">Nueva contraseña</label>
                <input type="password" class="form-control" id="reset-pass1" minlength="6" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirmar contraseña</label>
                <input type="password" class="form-control" id="reset-pass2" minlength="6" required>
            </div>
            <button type="submit" class="btn-gold" id="btn-reset">Cambiar contraseña</button>
        </form>
        <div class="reset-alert ok" id="reset-ok"></div>
        <div class="reset-alert err" id="reset-err"></div>
    </div>

    <a href="/" class="back-link">← Volver al inicio</a>
</div>

<script>
async function submitReset(e) {
    e.preventDefault();
    var pass1 = document.getElementById('reset-pass1').value;
    var pass2 = document.getElementById('reset-pass2').value;
    var token = document.getElementById('reset-token').value;
    var ok = document.getElementById('reset-ok');
    var err = document.getElementById('reset-err');
    ok.style.display = 'none'; err.style.display = 'none';

    if (pass1 !== pass2) {
        err.textContent = 'Las contraseñas no coinciden.';
        err.style.display = 'block';
        return;
    }

    var btn = document.getElementById('btn-reset');
    btn.disabled = true;
    btn.textContent = 'Cambiando...';

    try {
        var res = await fetch('/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token, password: pass1 })
        });
        var data = await res.json();
        if (data.ok) {
            ok.textContent = data.mensaje;
            ok.style.display = 'block';
            document.getElementById('form-reset').style.display = 'none';
        } else {
            err.textContent = data.mensaje;
            err.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Cambiar contraseña';
        }
    } catch (_) {
        err.textContent = 'Error de conexión. Inténtalo de nuevo.';
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Cambiar contraseña';
    }
}
</script>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
